<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Diagnóstico Operativo | Logística & Comercio Exterior Bogotá</title>

    <!-- Meta etiquetas Open Graph para vista previa atractiva en WhatsApp -->
    <meta property="og:title" content="Diagnóstico Ejecutivo 2026: Eficiencia en Logística y Comex (Bogotá)" />
    <meta property="og:description"
        content="Sondeo rápido sobre cuellos de botella operativos y automatización. Recibe tu diagnóstico inmediato." />
    <meta property="og:type" content="website" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }

        .fade-in {
            animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .option-card {
            transition: all 0.18s ease;
        }

        .option-card:active {
            transform: scale(0.985);
        }
    </style>
</head>

<body class="min-h-screen flex flex-col justify-between bg-gradient-to-b from-slate-950 via-slate-900 to-slate-950">

    <!-- Barra superior de progreso -->
    <header class="w-full max-w-lg mx-auto px-5 pt-6 pb-2">
        <div class="flex items-center justify-between text-xs text-slate-400 mb-2">
            <span class="font-semibold tracking-wider uppercase text-sky-400">Benchmarking Logístico • Bogotá</span>
            <span id="step-indicator">Inicio</span>
        </div>
        <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
            <div id="progress-bar" class="bg-sky-500 h-full transition-all duration-300 ease-out" style="width: 10%">
            </div>
        </div>
    </header>

    <!-- Contenedor principal dinámico -->
    <main id="app-container" class="w-full max-w-lg mx-auto px-5 py-4 flex-1 flex flex-col justify-center">
        <!-- Las pantallas se renderizan dinámicamente aquí -->
    </main>

    <!-- Pie de página discreto -->
    <footer class="w-full max-w-lg mx-auto px-5 py-4 text-center text-xs text-slate-500">
        Consultoría en Tecnología y Comercio Exterior • Datos 100% confidenciales
    </footer>

    <script>
        // =========================================================================
        // CONFIGURACIÓN PERSONALIZABLE
        // =========================================================================
        const CONFIG = {
            tuWhatsapp: "573219296294",
            webhookUrl: "https://script.google.com/macros/s/AKfycbzJmUbT31U4dCNGLKnkJntKQUKlaynPMRVN944lCajlzRDkQW9NgMU1q0McDg8bVBCZ/exec"
        };

        const urlParams = new URLSearchParams(window.location.search);
        const prospectRef = urlParams.get('c') || 'Directo';

        // =========================================================================
        // DEFINICIÓN DE PREGUNTAS (single | multiple | open)
        // =========================================================================
        const QUESTIONS = [
            {
                id: "perfil",
                title: "¿Cuál es el enfoque principal de tu empresa en la cadena logística?",
                subtitle: "Selecciona la opción que mejor los describa.",
                type: "single",
                options: [
                    { value: "Agente de carga (Freight Forwarder)", label: "Agente de carga internacional (Freight Forwarder)", score: 2 },
                    { value: "Operador logístico 3PL / Almacenamiento", label: "Operador logístico (3PL) / Almacenamiento y distribución", score: 2 },
                    { value: "Transporte terrestre de carga", label: "Transporte terrestre nacional / urbano de carga", score: 2 },
                    { value: "Importador / Exportador directo", label: "Empresa importadora o exportadora (dueña de carga)", score: 2 }
                ]
            },
            {
                id: "volumen",
                title: "En promedio, ¿qué volumen de operaciones o despachos gestionan al mes?",
                subtitle: "Esto nos ayuda a segmentar el estudio por tamaño de operación.",
                type: "single",
                options: [
                    { value: "Menos de 20 al mes", label: "Menos de 20 operaciones al mes", score: 1 },
                    { value: "Entre 20 y 80 al mes", label: "Entre 20 y 80 operaciones al mes", score: 2 },
                    { value: "Entre 80 y 250 al mes", label: "Entre 80 y 250 operaciones al mes", score: 3 },
                    { value: "Más de 250 al mes", label: "Más de 250 operaciones al mes", score: 3 }
                ]
            },
            {
                id: "cuellos_botella",
                title: "¿Qué tareas consumen hoy más tiempo manual o generan reprocesos?",
                subtitle: "Puedes seleccionar una o varias opciones.",
                type: "multiple",
                required: true,
                options: [
                    { value: "Digitar BL, facturas o manifiestos", label: "Digitar datos de BL, facturas, packing list o manifiestos", score: 2 },
                    { value: "Reportes de estatus a clientes", label: "Armar reportes de estatus o responder consultas por correo/WhatsApp", score: 2 },
                    { value: "Cotizaciones y tarifarios", label: "Cotizar rutas/servicios cruzando tarifas en Excel", score: 1 },
                    { value: "Conciliar costos por file", label: "Conciliar facturas de terceros, bodegajes o rentabilidad por operación", score: 2 },
                    { value: "Validaciones o clasificación", label: "Revisar documentos, descripciones o subpartidas/requisitos", score: 1 }
                ]
            },
            {
                id: "trazabilidad",
                title: "¿Cómo reciben hoy sus clientes el estatus de sus cargas o despachos?",
                subtitle: "Piensa en el flujo habitual del día a día.",
                type: "single",
                options: [
                    { value: "Portal / Alertas automáticas", label: "Tienen acceso a un portal o reciben alertas automáticas", score: 1 },
                    { value: "Reportes manuales en Excel/Correo", label: "Enviamos reportes periódicos armados en Excel o correo", score: 3 },
                    { value: "Por demanda (WhatsApp/Llamadas)", label: "Principalmente cuando el cliente escribe o llama a preguntar", score: 4 }
                ]
            },
            {
                id: "digitacion",
                title: "¿Qué tanto tiempo invierte el equipo digitando datos o armando cotizaciones?",
                subtitle: "Identificando fricción operativa.",
                type: "single",
                options: [
                    { value: "Automatizado / Integrado", label: "Muy poco, nuestros sistemas leen o integran casi todo", score: 1 },
                    { value: "Moderado (30%-50% manual)", label: "Moderado: usamos sistema, pero mucho se pasa a mano o Excel", score: 3 },
                    { value: "Alto cuello de botella", label: "Alto: gran parte se digita línea por línea y frena la operación", score: 4 }
                ]
            },
            {
                id: "rentabilidad",
                title: "Al cerrar una operación o file, ¿qué tan rápido conocen su utilidad real?",
                subtitle: "Control financiero por embarque o servicio.",
                type: "single",
                options: [
                    { value: "En tiempo real", label: "De inmediato, el sistema cruza costos y facturación al instante", score: 1 },
                    { value: "Toma días de conciliación", label: "Toma varios días cruzar facturas de proveedores en Excel", score: 3 },
                    { value: "Fugas ocasionales", label: "A veces detectamos sobrecostos no cobrados cuando ya cerró el mes", score: 4 }
                ]
            },
            {
                id: "prioridad",
                title: "¿Qué mejoras tendría mayor impacto inmediato en menos de 6 semanas?",
                subtitle: "Puedes marcar una o varias prioridades.",
                type: "multiple",
                required: true,
                options: [
                    { value: "Trazabilidad automática a clientes", label: "Portal o notificaciones automáticas de estatus para clientes", score: 2 },
                    { value: "Lectura automática de documentos PDF", label: "Extracción automática de datos de BL, facturas o manifiestos", score: 2 },
                    { value: "Cotizador ágil y control de márgenes", label: "Cotizador rápido con tarifarios centralizados", score: 1 },
                    { value: "Control financiero por operación", label: "Tablero de rentabilidad real por file (costos vs. facturación)", score: 2 },
                    { value: "Chatbots con IA para clientes o equipo", label: "Chatbots con IA para atención automática de estatus/consultas o soporte interno", score: 2 }
                ]
            },
            {
                id: "sistemas_actuales",
                title: "¿Qué software o herramientas usan hoy en su operación y qué se sigue haciendo por fuera?",
                subtitle: "Opcional • Ejemplo: TMS/ERP propio, Excel, correos, WhatsApp.",
                type: "open",
                required: false,
                placeholder: "Cuéntanos brevemente qué sistema usan y dónde sienten más fricción..."
            },
            {
                id: "comentario_abierto",
                title: "Si pudieras resolver hoy un problema puntual de tu operación, ¿cuál sería?",
                subtitle: "Opcional • Escríbelo en una o dos líneas.",
                type: "open",
                required: false,
                placeholder: "Ej. Automatizar la carga de ítems de facturas PDF o dar visibilidad automática a clientes..."
            }
        ];

        // Estado de la aplicación
        let currentStep = -1; // -1 = Bienvenida, 0..N-1 = Preguntas, N = Contacto, N+1 = Resultado
        let advanceTimeout = null;
        const answers = {
            referencia_url: prospectRef,
            fecha: new Date().toISOString(),
            cuellos_botella: [],
            prioridad: [],
            sistemas_actuales: "",
            comentario_abierto: ""
        };

        const container = document.getElementById("app-container");
        const progressBar = document.getElementById("progress-bar");
        const stepIndicator = document.getElementById("step-indicator");

        function escapeHtml(str) {
            return String(str || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function render() {
            const totalSteps = QUESTIONS.length + 2;

            // 1. PANTALLA DE BIENVENIDA
            if (currentStep === -1) {
                progressBar.style.width = "8%";
                stepIndicator.textContent = `${QUESTIONS.length} preguntas • ~2-3 min`;
                container.innerHTML = `
          <div class="fade-in space-y-6">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-sky-500/10 border border-sky-500/20 text-sky-400 text-xs font-medium">
              <span>🇨🇴 Estudio Sectorial Bogotá 2026</span>
            </div>
            
            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white leading-snug">
              ¿Dónde se está fugando tiempo y margen en tu operación logística?
            </h1>
            
            <p class="text-slate-300 text-sm sm:text-base leading-relaxed">
              Responde estas preguntas rápidas (con opciones múltiples y espacio abierto opcional). Al finalizar recibirás un <strong>diagnóstico inmediato de eficiencia operativa</strong>.
            </p>

            <div class="bg-slate-800/50 border border-slate-700/60 rounded-xl p-4 space-y-2 text-xs text-slate-300">
              <div class="flex items-center gap-2">
                <span class="text-emerald-400 font-bold">✓</span>
                <span>100% enfocado en realidad operativa y tecnológica</span>
              </div>
              <div class="flex items-center gap-2">
                <span class="text-emerald-400 font-bold">✓</span>
                <span>Resultados anónimos y confidenciales</span>
              </div>
            </div>

            <button onclick="nextStep()" class="w-full py-4 px-6 bg-sky-500 hover:bg-sky-400 active:bg-sky-600 text-slate-950 font-bold rounded-xl shadow-lg shadow-sky-500/20 transition text-base">
              Comenzar diagnóstico →
            </button>
          </div>
        `;
                return;
            }

            // 2. PANTALLAS DE PREGUNTAS
            if (currentStep >= 0 && currentStep < QUESTIONS.length) {
                const q = QUESTIONS[currentStep];
                const progress = Math.round(((currentStep + 1) / totalSteps) * 100);
                progressBar.style.width = `${progress}%`;
                stepIndicator.textContent = `${currentStep + 1} de ${QUESTIONS.length}`;

                let bodyHtml = "";

                if (q.type === "single") {
                    const optionsHtml = q.options.map((opt, idx) => {
                        const isSelected = answers[q.id]?.value === opt.value;
                        return `
              <button type="button" onclick="selectSingleOption('${q.id}', ${idx})" 
                class="option-card w-full text-left p-4 rounded-xl border ${isSelected
                                ? 'bg-sky-500/15 border-sky-400 text-white'
                                : 'bg-slate-800/60 border-slate-700/80 hover:border-slate-500 text-slate-200'
                            } flex items-center justify-between gap-3">
                <span class="text-sm sm:text-base font-medium leading-snug">${escapeHtml(opt.label)}</span>
                <span class="w-5 h-5 rounded-full border flex-shrink-0 flex items-center justify-center ${isSelected ? 'border-sky-400 bg-sky-400 text-slate-950' : 'border-slate-600'
                            }">
                  ${isSelected ? '✓' : ''}
                </span>
              </button>
            `;
                    }).join("");

                    bodyHtml = `<div class="space-y-3">${optionsHtml}</div>`;
                }

                if (q.type === "multiple") {
                    const selectedList = Array.isArray(answers[q.id]) ? answers[q.id] : [];
                    const selectedValues = selectedList.map(item => item.value);

                    const optionsHtml = q.options.map((opt, idx) => {
                        const isSelected = selectedValues.includes(opt.value);
                        return `
              <button type="button" onclick="toggleMultipleOption('${q.id}', ${idx})" 
                class="option-card w-full text-left p-4 rounded-xl border ${isSelected
                                ? 'bg-sky-500/15 border-sky-400 text-white'
                                : 'bg-slate-800/60 border-slate-700/80 hover:border-slate-500 text-slate-200'
                            } flex items-center justify-between gap-3">
                <span class="text-sm sm:text-base font-medium leading-snug">${escapeHtml(opt.label)}</span>
                <span class="w-5 h-5 rounded-md border flex-shrink-0 flex items-center justify-center text-xs font-bold ${isSelected ? 'border-sky-400 bg-sky-400 text-slate-950' : 'border-slate-600'
                            }">
                  ${isSelected ? '✓' : ''}
                </span>
              </button>
            `;
                    }).join("");

                    const canContinue = !q.required || selectedList.length > 0;
                    bodyHtml = `
            <div class="space-y-3">${optionsHtml}</div>
            <div class="pt-4">
              <button type="button" onclick="nextStep()" ${canContinue ? '' : 'disabled'}
                class="w-full py-3.5 px-6 rounded-xl font-bold text-sm sm:text-base transition ${canContinue
                            ? 'bg-sky-500 hover:bg-sky-400 text-slate-950 shadow-lg shadow-sky-500/20'
                            : 'bg-slate-800 text-slate-500 cursor-not-allowed'
                        }">
                ${canContinue ? 'Continuar →' : 'Selecciona al menos una opción'}
              </button>
            </div>
          `;
                }

                if (q.type === "open") {
                    const currentVal = answers[q.id] || "";
                    bodyHtml = `
            <div class="space-y-4">
              <textarea id="open-input" rows="4"
                placeholder="${escapeHtml(q.placeholder || 'Escribe aquí...')}"
                oninput="updateOpenAnswer('${q.id}', this.value)"
                class="w-full p-4 rounded-xl bg-slate-800/80 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-sky-400 text-sm leading-relaxed">${escapeHtml(currentVal)}</textarea>

              <button type="button" onclick="nextStep()"
                class="w-full py-3.5 px-6 bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold rounded-xl shadow-lg shadow-sky-500/20 transition text-sm sm:text-base">
                ${currentVal.trim() ? 'Continuar →' : (q.required ? 'Continuar →' : 'Omitir o continuar →')}
              </button>
            </div>
          `;
                }

                container.innerHTML = `
          <div class="fade-in space-y-5">
            <div>
              <h2 class="text-xl sm:text-2xl font-bold text-white leading-snug mb-1.5">${escapeHtml(q.title)}</h2>
              <p class="text-xs sm:text-sm text-slate-400">${escapeHtml(q.subtitle)}</p>
            </div>

            ${bodyHtml}

            <div class="pt-1 flex items-center justify-between">
              <button type="button" onclick="prevStep()" class="text-sm text-slate-400 hover:text-white py-2 px-3">
                ← Anterior
              </button>
            </div>
          </div>
        `;
                return;
            }

            // 3. PANTALLA DE CIERRE Y CONTACTO
            if (currentStep === QUESTIONS.length) {
                progressBar.style.width = "92%";
                stepIndicator.textContent = "Último paso";

                const defaultCompany = prospectRef !== 'Directo' ? escapeHtml(prospectRef) : '';

                container.innerHTML = `
          <div class="fade-in space-y-5">
            <div>
              <span class="text-xs font-semibold uppercase tracking-wider text-emerald-400">¡Listo! Ya tenemos tus respuestas</span>
              <h2 class="text-xl sm:text-2xl font-bold text-white mt-1 leading-snug">
                ¿A dónde te enviamos el informe comparativo del sector?
              </h2>
              <p class="text-xs sm:text-sm text-slate-400 mt-1">
                Al continuar verás tu diagnóstico inmediato en pantalla.
              </p>
            </div>

            <form onsubmit="submitSurvey(event)" class="space-y-3.5">
              <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Tu nombre *</label>
                <input type="text" id="input-nombre" required placeholder="Ej. Carlos Mendoza"
                  class="w-full px-4 py-3 rounded-xl bg-slate-800/80 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-sky-400 text-sm" />
              </div>

              <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Empresa *</label>
                <input type="text" id="input-empresa" required value="${defaultCompany}" placeholder="Nombre de tu empresa"
                  class="w-full px-4 py-3 rounded-xl bg-slate-800/80 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-sky-400 text-sm" />
              </div>

              <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Correo corporativo o WhatsApp *</label>
                <input type="text" id="input-contacto" required placeholder="carlos@empresa.com / 300..."
                  class="w-full px-4 py-3 rounded-xl bg-slate-800/80 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-sky-400 text-sm" />
              </div>

              <div class="pt-2 flex items-center justify-between gap-3">
                <button type="button" onclick="prevStep()" class="text-sm text-slate-400 hover:text-white py-3 px-3">
                  ← Atrás
                </button>
                <button type="submit" id="btn-submit" class="flex-1 py-3.5 px-6 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl shadow-lg shadow-emerald-500/20 transition text-sm sm:text-base">
                  Ver mi diagnóstico →
                </button>
              </div>
            </form>
          </div>
        `;
                return;
            }

            // 4. PANTALLA DE DIAGNÓSTICO AUTOMÁTICO
            if (currentStep > QUESTIONS.length) {
                progressBar.style.width = "100%";
                stepIndicator.textContent = "Completado";

                const diag = calcularDiagnostico();
                const safeEmpresa = escapeHtml(answers.empresa);
                const prioridadesTexto = formatMultiValue(answers.prioridad) || "Automatización operativa";
                const safePrioridad = escapeHtml(prioridadesTexto);
                const whatsappMsg = encodeURIComponent(
                    `Hola, acabo de completar el diagnóstico operativo de ${answers.empresa}. Me interesa revisar cómo avanzar en: ${prioridadesTexto}.`
                );

                container.innerHTML = `
          <div class="fade-in space-y-5">
            <div class="p-5 rounded-2xl bg-slate-800/80 border border-slate-700 space-y-3">
              <div class="flex items-center justify-between">
                <span class="text-xs font-semibold uppercase tracking-wider text-sky-400">Resultado Preliminar</span>
                <span class="px-2.5 py-0.5 rounded-full text-xs font-bold ${diag.badgeClass}">${diag.nivel}</span>
              </div>
              
              <h2 class="text-xl font-bold text-white leading-snug">${diag.titulo}</h2>
              <p class="text-sm text-slate-300 leading-relaxed">${diag.descripcion}</p>
              
              <div class="pt-2 border-t border-slate-700/80">
                <p class="text-xs text-slate-400 mb-1">Focos seleccionados de alto impacto:</p>
                <p class="text-sm font-semibold text-emerald-400">→ ${safePrioridad}</p>
              </div>
            </div>

            <div class="p-4 rounded-xl bg-sky-950/40 border border-sky-500/30 space-y-3">
              <p class="text-xs sm:text-sm text-slate-200 leading-relaxed">
                <strong>¿Quieres ver un caso práctico aplicado a ${safeEmpresa}?</strong><br>
                Podemos agendar una sesión corta de 15 minutos sin costo para mostrarte cómo abordar estos puntos sin cambiar tu ERP actual.
              </p>
              <a href="https://wa.me/${CONFIG.tuWhatsapp}?text=${whatsappMsg}" target="_blank" rel="noopener noreferrer"
                class="block w-full text-center py-3.5 px-4 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl transition text-sm">
                Agendar sesión de 15 min por WhatsApp
              </a>
            </div>
          </div>
        `;
            }
        }

        // =========================================================================
        // LÓGICA DE RESPUESTAS Y NAVEGACIÓN
        // =========================================================================
        function clearAdvanceTimeout() {
            if (advanceTimeout) {
                clearTimeout(advanceTimeout);
                advanceTimeout = null;
            }
        }

        function nextStep() {
            clearAdvanceTimeout();
            currentStep++;
            render();
        }

        function prevStep() {
            clearAdvanceTimeout();
            if (currentStep > -1) {
                currentStep--;
                render();
            }
        }

        function selectSingleOption(questionId, optionIndex) {
            clearAdvanceTimeout();
            const question = QUESTIONS.find(q => q.id === questionId);
            answers[questionId] = question.options[optionIndex];
            render();
            advanceTimeout = setTimeout(() => {
                nextStep();
            }, 220);
        }

        function toggleMultipleOption(questionId, optionIndex) {
            clearAdvanceTimeout();
            const question = QUESTIONS.find(q => q.id === questionId);
            const opt = question.options[optionIndex];
            if (!Array.isArray(answers[questionId])) {
                answers[questionId] = [];
            }
            const existsIdx = answers[questionId].findIndex(item => item.value === opt.value);
            if (existsIdx >= 0) {
                answers[questionId].splice(existsIdx, 1);
            } else {
                answers[questionId].push(opt);
            }
            render();
        }

        function updateOpenAnswer(questionId, value) {
            answers[questionId] = value;
        }

        function sumMultiScore(arr) {
            if (!Array.isArray(arr)) return 0;
            return arr.reduce((acc, item) => acc + (item.score || 0), 0);
        }

        function formatMultiValue(arr) {
            if (!Array.isArray(arr) || arr.length === 0) return "";
            return arr.map(item => item.value).join(" | ");
        }

        function calcularDiagnostico() {
            const score = (answers.trazabilidad?.score || 0) +
                (answers.digitacion?.score || 0) +
                (answers.rentabilidad?.score || 0) +
                Math.min(sumMultiScore(answers.cuellos_botella), 6);

            if (score >= 12) {
                return {
                    nivel: "Potencial de Ahorro Alto",
                    badgeClass: "bg-amber-500/20 text-amber-300 border border-amber-500/30",
                    titulo: "Alta carga manual con oportunidad inmediata de automatización",
                    descripcion: "Tu operación concentra varios puntos de fricción repetitiva y consolidación manual. Automatizar primero los flujos de mayor impacto puede liberar horas semanales clave de tu equipo."
                };
            } else if (score >= 7) {
                return {
                    nivel: "Potencial de Ahorro Medio-Alto",
                    badgeClass: "bg-sky-500/20 text-sky-300 border border-sky-500/30",
                    titulo: "Base operativa sólida, pero con brechas conectadas por Excel",
                    descripcion: "Cuentan con estructura operativa, pero aún dependen de procesos manuales o reportes externos. Una integración puntual tendría un retorno rápido."
                };
            } else {
                return {
                    nivel: "Madurez Digital Avanzada",
                    badgeClass: "bg-emerald-500/20 text-emerald-300 border border-emerald-500/30",
                    titulo: "Operación bien estructurada lista para optimización inteligente",
                    descripcion: "Tienen buen control operativo. El siguiente paso natural es incorporar automatización documental con IA, portales de autoservicio o analítica avanzada."
                };
            }
        }

        async function submitSurvey(event) {
            event.preventDefault();
            clearAdvanceTimeout();
            const btn = document.getElementById("btn-submit");
            btn.disabled = true;
            btn.textContent = "Procesando diagnóstico...";

            answers.nombre = document.getElementById("input-nombre").value.trim();
            answers.empresa = document.getElementById("input-empresa").value.trim();
            answers.contacto = document.getElementById("input-contacto").value.trim();

            // Payload aplanado amigable para Google Sheets
            const payload = {
                referencia_url: answers.referencia_url,
                fecha: answers.fecha,
                nombre: answers.nombre,
                empresa: answers.empresa,
                contacto: answers.contacto,
                perfil: answers.perfil?.value || "",
                volumen: answers.volumen?.value || "",
                cuellos_botella: formatMultiValue(answers.cuellos_botella),
                trazabilidad: answers.trazabilidad?.value || "",
                digitacion: answers.digitacion?.value || "",
                rentabilidad: answers.rentabilidad?.value || "",
                prioridad: formatMultiValue(answers.prioridad),
                sistemas_actuales: (answers.sistemas_actuales || "").trim(),
                comentario_abierto: (answers.comentario_abierto || "").trim()
            };

            if (CONFIG.webhookUrl) {
                try {
                    await fetch(CONFIG.webhookUrl, {
                        method: "POST",
                        mode: "no-cors",
                        body: JSON.stringify(payload)
                    });
                } catch (e) {
                    console.error("Error enviando datos:", e);
                }
            } else {
                console.log("Payload capturado:", payload);
            }

            nextStep();
        }

        // Inicializar
        render();
    </script>
</body>
